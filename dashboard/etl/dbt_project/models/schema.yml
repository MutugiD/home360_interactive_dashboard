version: 2

models:
  - name: stg_events_raw
    description: "Raw events from PostHog"
    columns:
      - name: event_id
        description: "Unique identifier for the event"
        tests:
          - unique
          - not_null
      - name: event_name
        description: "Name of the event"
        tests:
          - not_null
      - name: event_timestamp
        description: "Timestamp when the event occurred"
        tests:
          - not_null
      - name: user_id
        description: "ID of the user who triggered the event"
        tests:
          - not_null

  - name: stg_appsflyer_installs
    description: "Install events from AppsFlyer"
    columns:
      - name: install_id
        description: "Unique identifier for the install"
        tests:
          - unique
          - not_null
      - name: install_timestamp
        description: "Timestamp when the install occurred"
        tests:
          - not_null
      - name: user_id
        description: "ID of the user who installed"
        tests:
          - not_null

  - name: fct_signup_funnel
    description: "Signup funnel metrics"
    columns:
      - name: date
        description: "Date of the funnel metrics"
        tests:
          - not_null
      - name: step_name
        description: "Name of the funnel step"
        tests:
          - not_null
      - name: user_count
        description: "Number of users at this step"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fct_invite_conversion
    description: "Invite conversion metrics"
    columns:
      - name: date
        description: "Date of the conversion metrics"
        tests:
          - not_null
      - name: invites_sent
        description: "Number of invites sent"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: invites_accepted
        description: "Number of invites accepted"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: dim_date
    description: "Date dimension table"
    columns:
      - name: date
        description: "Date in YYYY-MM-DD format"
        tests:
          - unique
          - not_null
      - name: year
        description: "Year"
        tests:
          - not_null
      - name: month
        description: "Month (1-12)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1 and <= 12"
      - name: day
        description: "Day of month"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1 and <= 31"