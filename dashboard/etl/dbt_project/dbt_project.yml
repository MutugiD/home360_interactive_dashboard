name: 'home360_analytics'
version: '1.0.0'
config-version: 2

profile: 'home360'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  home360_analytics:
    materialized: table
    staging:
      materialized: view
      schema: staging
    marts:
      materialized: table
      schema: analytics

vars:
  posthog_schema: posthog
  appsflyer_schema: appsflyer
  analytics_schema: analytics

seeds:
  home360_analytics:
    schema: analytics
    materialized: table