<!-- Filters Panel -->
<div class="filters-panel bg-white rounded-lg shadow-lg p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Filters</h3>

    <form id="filters-form" method="GET" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">

        <!-- Date Range Filter -->
        <div class="form-group">
            <label for="date_range" class="block text-sm font-medium text-gray-700 mb-2">Date Range</label>
            <select id="date_range" name="date_range" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="all" {% if current_filters.get('date_range') == 'all' or not current_filters.get('date_range') %}selected{% endif %}>All Time</option>
                <option value="7days" {% if current_filters.get('date_range') == '7days' %}selected{% endif %}>Last 7 Days</option>
                <option value="30days" {% if current_filters.get('date_range') == '30days' %}selected{% endif %}>Last 30 Days</option>
                <option value="custom" {% if current_filters.get('date_range') == 'custom' %}selected{% endif %}>Custom Range</option>
            </select>
        </div>

        <!-- Custom Date Range (hidden by default) -->
        <div id="custom-date-range" class="form-group col-span-2" style="display: {% if current_filters.get('date_range') == 'custom' %}block{% else %}none{% endif %};">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                    <input type="date" id="start_date" name="start_date" value="{{ current_filters.get('start_date', '') }}"
                           class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                    <input type="date" id="end_date" name="end_date" value="{{ current_filters.get('end_date', '') }}"
                           class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- User Role Filter -->
        <div class="form-group">
            <label for="role" class="block text-sm font-medium text-gray-700 mb-2">User Role</label>
            <select id="role" name="role" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="all" {% if current_filters.get('role') == 'all' or not current_filters.get('role') %}selected{% endif %}>All Roles</option>
                {% for role_data in roles %}
                    <option value="{{ role_data.role }}" {% if current_filters.get('role') == role_data.role %}selected{% endif %}>
                        {{ role_data.role }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Home Filter -->
        <div class="form-group">
            <label for="home_id" class="block text-sm font-medium text-gray-700 mb-2">Home</label>
            <select id="home_id" name="home_id" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="" {% if not current_filters.get('home_id') %}selected{% endif %}>All Homes</option>
                {% for home in homes %}
                    <option value="{{ home.id }}" {% if current_filters.get('home_id') == home.id %}selected{% endif %}>
                        {{ home.name }} (ID: {{ home.id }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- User ID Filter -->
        <div class="form-group">
            <label for="user_id" class="block text-sm font-medium text-gray-700 mb-2">User ID</label>
            <input type="number" id="user_id" name="user_id" value="{{ current_filters.get('user_id', '') }}"
                   placeholder="Enter User ID"
                   class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Filter Actions -->
        <div class="form-group flex items-end space-x-2">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 transition-colors">
                Apply Filters
            </button>
            <button type="button" id="clear-filters" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 focus:ring-2 focus:ring-gray-500 transition-colors">
                Clear
            </button>
        </div>
    </form>
</div>

<!-- Filter JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dateRangeSelect = document.getElementById('date_range');
    const customDateRange = document.getElementById('custom-date-range');
    const clearFiltersBtn = document.getElementById('clear-filters');
    const filtersForm = document.getElementById('filters-form');

    // Show/hide custom date range
    dateRangeSelect.addEventListener('change', function() {
        if (this.value === 'custom') {
            customDateRange.style.display = 'block';
        } else {
            customDateRange.style.display = 'none';
        }
    });

    // Clear filters
    clearFiltersBtn.addEventListener('click', function() {
        // Reset all form fields
        filtersForm.reset();
        customDateRange.style.display = 'none';

        // Redirect to current page without query parameters
        window.location.href = window.location.pathname;
    });

    // Auto-submit on filter change (optional)
    const filterInputs = filtersForm.querySelectorAll('select, input');
    filterInputs.forEach(input => {
        if (input.type !== 'submit' && input.id !== 'user_id') {
            input.addEventListener('change', function() {
                // Auto-submit form when filters change (except for user_id which needs manual entry)
                if (input.id === 'date_range' && input.value === 'custom') {
                    // Don't auto-submit when switching to custom, wait for date selection
                    return;
                }
                filtersForm.submit();
            });
        }
    });
});
</script>
